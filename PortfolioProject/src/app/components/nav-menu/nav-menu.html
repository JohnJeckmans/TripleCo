<!-- Hamburger menu -->
<button
  type="button"
  class="menu-container"
  id="menu-bars"
  [class.change]="mobileOpen()"
  [attr.aria-expanded]="mobileOpen()"
  aria-controls="mobile-nav"
  [attr.aria-label]="t().nav.menu"
  (click)="toggleMobile()"
>
  <div class="bar1"></div>
  <div class="bar2"></div>
  <div class="bar3"></div>
</button>

<!-- Mobile Navigation -->
<nav class="mobile-nav" id="mobile-nav" [class.nav-expand]="mobileOpen()">
  <ul class="nav-items">
    <li style="padding-top: 48px"></li>
    <li><a href="#home" (click)="toggleMobile()">{{ t().nav.home }}</a></li>
    <li><a href="#about" (click)="toggleMobile()">{{ t().nav.about }}</a></li>
    <li><a href="#services" (click)="toggleMobile()">{{ t().nav.services }}</a></li>
    <li><a href="#experience" (click)="toggleMobile()">{{ t().nav.experience }}</a></li>
    <li><a href="#contact" (click)="toggleMobile()">{{ t().nav.contact }}</a></li>
  </ul>
</nav>

<!-- Desktop Navigation -->
<nav
  class="sidebar-container"
  (mouseenter)="sidebarOpen.set(true)"
  (mouseleave)="sidebarOpen.set(false)"
  (focusin)="sidebarOpen.set(true)"
  (focusout)="sidebarOpen.set(false)"
>
  <p class="sidebar-toggle" id="sidebar-toggle" [class.display-none]="sidebarOpen()">{{ t().nav.menu }}</p>
  <ul class="sidebar-items desktop-nav" id="desktop-nav" [class.display-none]="!sidebarOpen()">
    <li><a href="#home">{{ t().nav.home }}</a></li>
    <li><a href="#about">{{ t().nav.about }}</a></li>
    <li><a href="#services">{{ t().nav.services }}</a></li>
    <li><a href="#experience">{{ t().nav.experience }}</a></li>
    <li><a href="#contact">{{ t().nav.contact }}</a></li>
  </ul>
</nav>
