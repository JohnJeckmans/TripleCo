@let nav = t().nav;
<!-- Hamburger menu (phones and tablets) -->
<button
  type="button"
  class="menu-container"
  id="menu-bars"
  [class.change]="mobileOpen()"
  [attr.aria-expanded]="mobileOpen()"
  aria-controls="mobile-nav"
  [attr.aria-label]="nav.menu"
  (click)="toggleMobile()"
>
  <span class="bar1"></span>
  <span class="bar2"></span>
  <span class="bar3"></span>
</button>

<!-- Mobile Navigation: hidden from keyboard and screen readers while closed -->
<nav class="mobile-nav" id="mobile-nav" [class.nav-expand]="mobileOpen()" [attr.inert]="mobileOpen() ? null : ''">
  <ul class="nav-items">
    @for (id of sections; track id) {
      <li>
        <a [href]="'#' + id" [class.active]="active() === id" [attr.aria-current]="active() === id ? 'location' : null" (click)="toggleMobile()">{{ nav[id] }}</a>
      </li>
    }
  </ul>
</nav>

<!-- Desktop Navigation: opens on hover, or with the keyboard via the Menu button -->
<nav
  class="sidebar-container"
  (mouseenter)="sidebarOpen.set(true)"
  (mouseleave)="sidebarOpen.set(false)"
  (focusin)="sidebarOpen.set(true)"
  (focusout)="sidebarOpen.set(false)"
>
  <button type="button" class="sidebar-toggle" id="sidebar-toggle" [attr.aria-expanded]="sidebarOpen()" aria-controls="desktop-nav">
    <span class="bars" aria-hidden="true"></span>{{ nav.menu }}
  </button>
  <ul class="sidebar-items desktop-nav" id="desktop-nav" [class.display-none]="!sidebarOpen()">
    @for (id of sections; track id) {
      <li>
        <a [href]="'#' + id" [class.active]="active() === id" [attr.aria-current]="active() === id ? 'location' : null">{{ nav[id] }}</a>
      </li>
    }
  </ul>
</nav>
